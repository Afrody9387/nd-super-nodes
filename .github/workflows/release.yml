name: Build fork release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run type-check
          npm run build
      - name: Package runtime
        run: python scripts/package_release.py
      - name: Publish compiled release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          tag="v$version"
          asset="dist/nd-super-nodes-v$version.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump project version for another release."
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" --title "ND Super Nodes $tag (Afrody fork)" --notes-file FORK_RELEASE_NOTES.md
          fi
